name: Refresh player lines
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: player-line-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependency
        run: python -m pip install 'requests>=2.32.3,<3'
      - name: Test collection and failure handling
        run: python tests/test_collect_player_consensus.py
      - name: Collect supported NBA lines
        id: collect
        continue-on-error: true
        env:
          NBAI_SCHEDULED_COLLECTION: '1'
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python scripts/collect_player_consensus.py --collect --max-events 60 --max-credits 300
      - name: Keep redacted source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-line-receipts-${{ github.run_id }}
          path: data/features/player_props/consensus/
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish snapshot or collection failure status
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          git config user.name "$OWNER"
          git config user.email "$OWNER@users.noreply.github.com"
          git add web/player-consensus.json web/player-consensus-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh NBA player-line snapshot and collection status'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Surface collection failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
