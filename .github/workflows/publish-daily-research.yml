name: Publish daily research picks
on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh player lines']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: player-line-collection
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install public-data collector dependencies
        run: python -m pip install 'requests>=2.32.3,<3' 'numpy==2.0.2' 'pandas==2.3.3' 'pyarrow==21.0.0' 'PyMuPDF>=1.24,<2'
      - name: Test research selection and publication guards
        run: |
          python tests/test_publish_daily_research.py
          node --test tests/test_research_picks.cjs tests/test_kalshi_day.cjs
      - name: Refresh public availability and matching identity bundle
        run: |
          python scripts/collect_game_availability.py
          node scripts/build_market_game_projections.cjs
          node tests/test_market_game_export.cjs
          node scripts/build_player_line_coverage.cjs
          node scripts/build_manual_order_snapshot.cjs
      - name: Generate today's research card
        run: python scripts/publish_daily_research.py
      - name: Archive source observations and superseded cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-research-${{ github.run_id }}
          path: |
            data/features/daily_research_publication/
            data/features/game_availability/
          retention-days: 30
          if-no-files-found: ignore
      - name: Publish verified card and matching bundle
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          git config user.name "$OWNER"
          git config user.email "$OWNER@users.noreply.github.com"
          git add web/research-picks.json web/kalshi-board-quotes.json web/game-availability.json web/player-game-projections.json web/player-line-coverage.json web/game-watchlist.json web/manual-order-snapshot.json web/kalshi-board-model.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish daily NBA research picks and fresh availability'
          git pull --rebase origin main
          git push origin HEAD:main
